# ==========================================
# CinePass Booking Service Configuration
# ==========================================

spring.application.name=BOOKING-SERVICE
server.port=8004

# Error handling
server.error.include-message=always
server.error.include-binding-errors=always

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/cinepass_bookings
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# JWT Secret for verification
jwt.secret=CinePassSuperSecretKeyForJWTSigning2026HighConcurrencyCinemaEngine!

# Microservice URLs (Resolved dynamically or via fallback localhost)
services.show-service.url=http://localhost:8002
services.user-service.url=http://localhost:8003
services.movie-service.url=http://localhost:8001
